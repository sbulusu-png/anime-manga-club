# Fly.io config for the API. Deploy from the repository root:
#   fly deploy . --config apps/api/fly.toml
# Secrets are set with `fly secrets set` (see apps/api/DEPLOY.md), never in this file.

app = "anime-manga-club-api"
primary_region = "sin" # Singapore, next to the Neon database (ap-southeast-1)

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once per deploy, before new machines start; a failure stops the deploy.
  release_command = "node dist/scripts/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  LOG_LEVEL = "info"
  CLUB_TIMEZONE = "Asia/Kolkata"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    # Neon may be waking from suspend on the first check.
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
