<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime Manga Club Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0a10;
      --ink: #f5f3ff;
      --muted: #a9a3c2;
      --luffy: #e63946;
      --ichigo: #ff8c1a;
      --asta: #2dbd6e;
      --edward: #d4a017;
      --conan: #2f6fed;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .banner {
      position: relative;
      width: min(1400px, 100%);
      aspect-ratio: 21 / 8;
      min-height: 320px;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 120%, #2a1f4d 0%, transparent 60%),
        repeating-linear-gradient(115deg, #ffffff06 0 2px, transparent 2px 14px),
        var(--bg);
      box-shadow: 0 30px 80px #00000080;
    }
    .panels {
      position: absolute;
      inset: 0;
      display: flex;
      gap: 6px;
      padding: 0 3%;
      transform: skewX(-8deg);
    }
    .panel {
      --c: #fff;
      position: relative;
      flex: 1;
      overflow: hidden;
      border-bottom: 6px solid var(--c);
      transition: flex 0.5s cubic-bezier(.2,.8,.2,1);
      background: linear-gradient(180deg, transparent 40%, color-mix(in srgb, var(--c) 45%, transparent));
    }
    .panel:hover { flex: 1.8; }
    .panel img {
      position: absolute;
      inset: -4% -30%;
      width: 160%;
      height: 108%;
      object-fit: cover;
      object-position: top center;
      transform: skewX(8deg);
      filter: saturate(1.1) contrast(1.05);
      mix-blend-mode: luminosity;
      opacity: 0.9;
      transition: mix-blend-mode 0s, opacity 0.4s;
    }
    .panel:hover img { mix-blend-mode: normal; opacity: 1; }
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, #0b0a10ee 100%);
    }
    .title {
      position: absolute;
      left: 0; right: 0; bottom: 5%;
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }
    .title h1 {
      font-family: Bangers, Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(34px, 6.5vw, 96px);
      letter-spacing: 3px;
      line-height: 0.9;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--luffy), 8px 8px 0 #000;
    }
    .title h1 .ch { display: inline-block; }
    .title p {
      margin-top: 8px;
      font-size: clamp(10px, 1.1vw, 15px);
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .banner { aspect-ratio: 4 / 5; }
      .panels { flex-direction: column; transform: none; padding: 0; gap: 3px; }
      .panel img { inset: 0; width: 100%; height: 100%; object-position: center 20%; transform: none; }
      .title { bottom: auto; top: 50%; translate: 0 -50%; }
    }
    </style>
</head>
<body>
  <section class="banner" aria-label="Anime Manga Club banner">
    <div class="panels">
      <article class="panel" style="--c: var(--luffy)">
        <img src="https://s4.anilist.co/file/anilistcdn/character/large/b40-MNypXsxSRb1R.png" alt="Monkey D. Luffy" referrerpolicy="no-referrer" />
      </article>
      <article class="panel" style="--c: var(--ichigo)">
        <img src="https://s4.anilist.co/file/anilistcdn/character/large/b5-a7bkJgjhhigE.png" alt="Ichigo Kurosaki" referrerpolicy="no-referrer" />
      </article>
      <article class="panel" style="--c: var(--asta)">
        <img src="https://s4.anilist.co/file/anilistcdn/character/large/b123285-tKijiuQErDS0.png" alt="Asta" referrerpolicy="no-referrer" />
      </article>
      <article class="panel" style="--c: var(--edward)">
        <img src="https://s4.anilist.co/file/anilistcdn/character/large/b11-TA5Nuk7EDUZG.jpg" alt="Edward Elric" referrerpolicy="no-referrer" />
      </article>
      <article class="panel" style="--c: var(--conan)">
        <img src="https://s4.anilist.co/file/anilistcdn/character/large/b1742-NiV278NBFOvZ.png" alt="Conan Edogawa" referrerpolicy="no-referrer" />
      </article>
    </div>
    <div class="title">
      <h1 id="headline">ANIME MANGA CLUB</h1>
      <p>Reviews · Suggestions · Debates</p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    // Split headline into per-letter spans for the stagger.
    const h1 = document.getElementById("headline");
    h1.innerHTML = [...h1.textContent]
      .map((c) => (c === " " ? " " : `<span class="ch">${c}</span>`))
      .join("");

    const mm = gsap.matchMedia();
    mm.add(
      { motion: "(prefers-reduced-motion: no-preference)", mobile: "(max-width: 640px)" },
      ({ conditions }) => {
        if (!conditions.motion) return;
        const tl = gsap.timeline({ defaults: { duration: 0.7, ease: "power3.out" } });
        tl.addLabel("panels")
          .from(".panel", conditions.mobile
            ? { xPercent: -110, stagger: 0.08 }
            : { yPercent: 110, stagger: 0.09 }, "panels")
          .from(".panel img", { scale: 1.3, stagger: 0.09, duration: 1.1 }, "panels")
          .addLabel("title", "-=0.3")
          .from(".ch", { yPercent: 120, rotate: -15, autoAlpha: 0, stagger: 0.04, ease: "back.out(2.5)" }, "title")
          .from(".title p", { autoAlpha: 0, letterSpacing: "18px", duration: 0.6 }, "<0.3");
      }
    );
  </script>
</body>
</html>
