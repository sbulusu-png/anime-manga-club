<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anya Theme Toggle</title>
  <style>
    :root { --bg: #f7f5ff; --ink: #1b1830; --ring: #e8b4c8; }
    :root[data-theme="dark"] { --bg: #0b0a10; --ink: #f5f3ff; --ring: #7a4d66; }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      transition: background 0.4s, color 0.4s;
    }
    .toggle {
      position: fixed;
      top: 12px;
      right: 16px;
      width: 88px;
      height: 88px;
      padding: 0;
      border: 2px solid var(--ring);
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--ring) 35%, transparent), transparent 70%);
      cursor: pointer;
      overflow: hidden;
    }
    .toggle:focus-visible { outline: 3px solid #2f6fed; outline-offset: 3px; }
    .toggle canvas { display: block; width: 100%; height: 100%; }
    main { max-width: 640px; margin: 120px auto 0; line-height: 1.6; }
  </style>
</head>
<body>
  <button class="toggle" id="toggle" aria-label="Switch to dark theme" aria-pressed="false"></button>
  <main>
    <h1>Theme toggle prototype</h1>
    <p>Anya spins in the corner. Click her to switch between light and dark themes.</p>
  </main>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

    const button = document.getElementById("toggle");
    const root = document.documentElement;
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    button.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 10);
    const pivot = new THREE.Group();
    scene.add(pivot);

    function resize() {
      const { clientWidth: w, clientHeight: h } = button;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(button);

    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    loader.load("../assets/models/anya.opt.glb", (gltf) => {
      const model = gltf.scene;
      // Centre the model on the pivot and frame the full body. Aiming the
      // camera slightly above centre sits her a little lower in the circle.
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      pivot.add(model);
      const framed = size.y;
      const targetY = size.y * 0.06;
      const fit = framed / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      camera.position.set(0, targetY, fit * 1.25);
      camera.lookAt(0, targetY, 0);
      render();
    });

    function render() { renderer.render(scene, camera); }

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (!reduceMotion.matches) {
        pivot.rotation.y += dt * 1.2;
        pivot.position.y = Math.sin(clock.elapsedTime * 2) * 0.01;
      }
      render();
    });

    button.addEventListener("click", () => {
      const dark = root.dataset.theme !== "dark";
      root.dataset.theme = dark ? "dark" : "light";
      button.setAttribute("aria-pressed", String(dark));
      button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      // A quick full spin as click feedback.
      if (!reduceMotion.matches) pivot.rotation.y += Math.PI;
    });
  </script>
</body>
</html>
